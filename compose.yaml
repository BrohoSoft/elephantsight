# ElephantSight self-hosted: `docker compose up -d`, poi apri l'indirizzo e
# completa l'installazione.
#
# Prima di partire, in un file .env accanto a questo:
#   DB_PASSWORD=una-password-lunga
#   PUBLIC_URL=https://flarelytics.tuodominio.it   (o http://localhost:8080)
#
# Dietro HTTPS (consigliato) lascia SECURE_COOKIES a true. Solo se lo apri in
# HTTP da un indirizzo diverso da localhost mettilo a false, altrimenti il
# browser non conserva la sessione.

name: flarelytics

services:
  app:
    image: flarelytics:latest
    build: .
    restart: unless-stopped
    ports:
      # Dietro un tunnel (Cloudflare) o un proxy sulla stessa macchina metti
      # BIND_ADDRESS=127.0.0.1: la porta non resta aperta verso l'esterno.
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080"
    environment:
      ConnectionStrings__Database: Host=postgres;Database=flarelytics;Username=flarelytics;Password=${DB_PASSWORD:?manca DB_PASSWORD}
      # Il ruolo dei backup (solo lettura, vede tutte le organizzazioni): lo
      # crea deploy/postgres/20-backup-role.sh.
      ConnectionStrings__Backup: Host=postgres;Database=flarelytics;Username=flarelytics_backup;Password=${DB_PASSWORD}
      Auth__PublicAppUrl: ${PUBLIC_URL:-http://localhost:8080}
      Auth__SecureCookies: ${SECURE_COOKIES:-true}
      # Facoltativo: senza, gli inviti si mandano copiando il link.
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__FromAddress: ${SMTP_FROM:-}
      # SMTP e app social si possono mettere anche dal pannello (Impostazioni
      # dell'istanza), senza riavviare: quei valori vincono su questi.
      # Facoltativo: l'app Meta per pubblicare su Instagram e sulle Pagine
      # Facebook (il pannello spiega come crearla). Senza, restano Bluesky e
      # Mastodon. Instagram scarica le immagini da PUBLIC_URL: deve essere
      # raggiungibile da internet.
      Social__Meta__AppId: ${META_APP_ID:-}
      Social__Meta__AppSecret: ${META_APP_SECRET:-}
      # Facoltativo: Instagram senza Pagina Facebook ("Instagram Login").
      # Sono l'Instagram App ID e il suo secret, non quelli dell'app Meta.
      Social__Instagram__AppId: ${INSTAGRAM_APP_ID:-}
      Social__Instagram__AppSecret: ${INSTAGRAM_APP_SECRET:-}
      # Facoltativo: TikTok (developers.tiktok.com, Login Kit + Content Posting API).
      Social__TikTok__ClientKey: ${TIKTOK_CLIENT_KEY:-}
      Social__TikTok__ClientSecret: ${TIKTOK_CLIENT_SECRET:-}
      # Facoltativo: Threads (caso d'uso "Access the Threads API" di un'app Meta).
      # Sono il Threads App ID e il suo secret, non quelli dell'app Meta.
      Social__Threads__AppId: ${THREADS_APP_ID:-}
      Social__Threads__AppSecret: ${THREADS_APP_SECRET:-}
      # Facoltativo: immagini e video dei post su Bunny Storage invece che sul
      # disco, sempre cifrati (Bunny non vede mai il contenuto; i file li legge
      # e li serve l'API). Si configura anche dal pannello (Impostazioni
      # dell'istanza → Storage dei file), che vince su questi valori.
      # MEDIA_STORAGE: auto (Bunny se configurato, altrimenti disco), local
      # (sempre disco) o remote (mai disco: senza Bunny niente caricamenti).
      Media__Storage: ${MEDIA_STORAGE:-auto}
      # true = Bunny si configura solo da qui: la sezione sparisce dal pannello
      # e quello che vi era salvato non conta (istanze ospitate: lo storage è
      # di chi le ospita, non del cliente).
      Media__Locked: ${MEDIA_STORAGE_LOCKED:-false}
      Media__Bunny__StorageZone: ${BUNNY_STORAGE_ZONE:-}
      # Vuoto = Falkenstein; altrimenti uk, ny, la, sg, se, br, jh, syd.
      Media__Bunny__Region: ${BUNNY_STORAGE_REGION:-}
      # La password della storage zone (FTP & API Access), non la chiave dell'account.
      Media__Bunny__AccessKey: ${BUNNY_STORAGE_ACCESS_KEY:-}
      # Giorni dopo la pubblicazione (riuscita ovunque) in cui si cancellano
      # gli originali: restano la miniatura e il link al post.
      Media__CleanupAfterDays: ${MEDIA_CLEANUP_AFTER_DAYS:-7}
      # Backup dell'istanza (database, chiavi, credenziali, report), cifrati con
      # una password e programmati dal pannello (Impostazioni dell'istanza).
      # false = la funzione non c'è: niente pagina né backup (per un'istanza
      # ospitata, dove i backup li fa chi la ospita).
      Backups__Enabled: ${BACKUPS_ENABLED:-true}
      Backups__Directory: /data/backups
      # Chi gestisce questa installazione e un'email di contatto: compaiono
      # nelle pagine /privacy e /terms, che TikTok e Meta chiedono per le app.
      Legal__Owner: ${LEGAL_OWNER:-}
      Legal__ContactEmail: ${LEGAL_CONTACT_EMAIL:-}
    volumes:
      # Le chiavi: quella che cifra le credenziali degli store e quella dei
      # login. Vanno salvate a parte rispetto al resto: senza la chiave master
      # le credenziali non si decifrano più.
      - flarelytics-keys:/data/keys
      # Credenziali cifrate e report scaricati dagli store.
      - flarelytics-data:/data/secrets
      - flarelytics-reports:/data/reports
      # I backup: stanno sullo stesso server, quindi scaricali dal pannello (o
      # copiali altrove) per averne una copia se si perde la macchina.
      - flarelytics-backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: &log
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      APP_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Crea il ruolo con cui si collega l'app: non superutente, perché un
      # superutente ignorerebbe la Row-Level Security.
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flarelytics"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *log

volumes:
  flarelytics-keys:
  flarelytics-data:
  flarelytics-reports:
  flarelytics-backups:
  postgres-data:
