# Produzione su una macchina sola: Caddy davanti, l'API e PostgreSQL dietro.
# Solo Caddy espone porte; gli altri si parlano sulla rete interna.
#
# Prima di partire servono, accanto a questo file:
#   .env              copiato da .env.example e compilato
#   keys/v1.key       la chiave master (vedi README, "Chiave master")

name: flarelytics

services:
  # Il proxy, che serve anche il frontend: l'immagine è Caddy con dentro la
  # build di Flarelytics.Web.
  caddy:
    image: flarelytics-web:corrente
    build:
      context: ../Flarelytics.Web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMINIO: ${DOMINIO:?manca DOMINIO}
    depends_on: [api]
    logging: &log
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    image: flarelytics-api:corrente
    build:
      context: ..
      dockerfile: Flarelytics.Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: Host=postgres;Database=flarelytics;Username=flarelytics;Password=${APP_DB_PASSWORD:?manca APP_DB_PASSWORD}
      Jwt__Key: ${JWT_KEY:?manca JWT_KEY}
      Auth__PublicAppUrl: https://${DOMINIO}
      Secrets__ActiveKeyVersion: ${MASTER_KEY_VERSION:-v1}
      Email__Smtp__Host: ${SMTP_HOST:?manca SMTP_HOST}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Username: ${SMTP_USERNAME:?manca SMTP_USERNAME}
      Email__Smtp__Password: ${SMTP_PASSWORD:?manca SMTP_PASSWORD}
      Email__Smtp__FromAddress: ${SMTP_FROM:?manca SMTP_FROM}
    volumes:
      # La chiave master, in sola lettura. Sta sul disco della macchina e NON
      # nel volume dei dati: il backup dei dati non deve contenerla, altrimenti
      # chi ruba il backup ha anche la chiave per aprirlo.
      - ./keys:/run/secrets/flarelytics-keys:ro
      # I file cifrati delle credenziali dei clienti.
      - credential-data:/var/lib/flarelytics/secrets
      # Solo per cancellare i report di una chiave quando la si elimina.
      - report-data:/var/lib/flarelytics/reports
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8080"]
    logging: *log

  # Il worker: scarica i report dagli store e calcola le metriche. Una sola
  # istanza, niente porte. Parte dopo l'API, che è quella che applica le
  # migration.
  worker:
    image: flarelytics-worker:corrente
    build:
      context: ..
      dockerfile: Flarelytics.Worker/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: Host=postgres;Database=flarelytics;Username=flarelytics;Password=${APP_DB_PASSWORD}
      Secrets__ActiveKeyVersion: ${MASTER_KEY_VERSION:-v1}
    volumes:
      - ./keys:/run/secrets/flarelytics-keys:ro
      # In sola lettura: le chiavi le scrive l'API, il worker le usa e basta.
      - credential-data:/var/lib/flarelytics/secrets:ro
      # I report grezzi: la fonte da cui si ricalcolano le metriche. Va nel
      # backup, perché gli store non tengono lo storico per sempre.
      - report-data:/var/lib/flarelytics/reports
    depends_on:
      api:
        condition: service_started
    logging: *log

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?manca POSTGRES_ADMIN_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flarelytics"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *log

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  credential-data:
  report-data:
